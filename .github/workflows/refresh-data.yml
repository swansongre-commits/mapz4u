name: 데이터 자동 갱신 (TourAPI · 정보나루)

# 매일 새벽 공공 API에서 체험·행사·도서 데이터를 새로 받아 DB를 재생성한다.
# 품질 가드를 통과한 경우에만 커밋·푸시하며, 푸시되면 Render(와 Streamlit)가 자동 재배포한다.
# 실패하면 커밋하지 않으므로 서비스는 직전 정상 데이터를 유지한다.

on:
  schedule:
    - cron: "0 20 * * *"   # 매일 05:00 KST (UTC 20:00)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: real
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: real/deploy/requirements.txt

      - name: 의존성 설치
        run: pip install -r deploy/requirements.txt pytest httpx beautifulsoup4

      - name: 키 확인
        run: |
          test -n "$DATA_GO_KR_KEY" || { echo "::error::DATA_GO_KR_KEY 시크릿이 없습니다"; exit 1; }
          test -n "$DATA4LIBRARY_KEY" || { echo "::error::DATA4LIBRARY_KEY 시크릿이 없습니다"; exit 1; }

      - name: 수집 → 검토 → 연계 → DB → 품질 가드
        run: python scripts/refresh.py

      - name: 테스트 · 금지어 lint
        run: |
          python -m pytest tests/test_api.py -q
          python scripts/lint_forbidden.py

      - name: 변경분 커밋·푸시
        run: |
          git config user.name "mapz-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clean db/mapz_real.db data/raw/experiences.json data/raw/books.json reports/freshness_dashboard.md
          if git diff --cached --quiet; then
            echo "데이터 변경 없음"
            exit 0
          fi
          git commit -m "data: 자동 갱신 $(date +%Y-%m-%d) (TourAPI · 정보나루)"
          git push

      - name: 갱신 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: real/state/refresh_log.md
          if-no-files-found: ignore
